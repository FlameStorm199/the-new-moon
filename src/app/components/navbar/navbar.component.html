<header>
  <div class="nav-wrapper">
    <a routerLink="/" class="logo-link" aria-label="Home">
      <img src="assets/images/logo_LLN.bmp" alt="Logo La Luna Nuova" class="logo" />
    </a>

    <!-- Visibile solo sotto la soglia mobile: apre i link in un pannello -->
    <button
      type="button"
      class="menu-toggle"
      [class.open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-controls="nav-menu"
      aria-label="Menu"
      (click)="toggleMenu($event)"
    >
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <div class="nav-right" id="nav-menu" [class.open]="menuOpen">
      <nav>
        <div class="nav-links">
          @for (link of links(); track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: !!link.exact }"
            >
              {{ link.label }}
            </a>
          }

          @if (inBookingArea()) {
            <a routerLink="/" class="exit-link">← Torna al sito</a>
          }
        </div>
      </nav>
      <div class="paw-divider">
        <span>🐾</span>
      </div>
    </div>

    <div class="social-buttons">
      <div class="fb-wrapper">
        <button class="fb-btn" aria-label="Facebook" (click)="toggleFbDropdown($event)">
          <i class="fa-brands fa-facebook-f"></i>
        </button>
        <div class="fb-dropdown" *ngIf="fbDropdownOpen">
          <a [href]="facebookGeneralUrl" target="_blank" (click)="closeFbDropdown()">
            <i class="fa-brands fa-facebook-f"></i> La Luna Nuova
          </a>
          <a [href]="facebookPonzanoUrl" target="_blank" (click)="closeFbDropdown()">
            <i class="fa-brands fa-facebook-f"></i> Sede di Ponzano
          </a>
        </div>
      </div>
      <a [href]="instagramUrl" target="_blank" class="ig-btn" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
    </div>
  </div>
</header>
