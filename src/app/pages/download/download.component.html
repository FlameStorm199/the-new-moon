<div class="download">
  <h2>Bacheca</h2>
  <p class="subtitle">Modulistica e documenti scaricabili</p>

  <div class="category-section" *ngFor="let category of categories">
    <h3>{{ category }}</h3>
    <div class="download-list">
      <div
        class="download-card"
        *ngFor="let item of getByCategory(category)"
        (click)="downloadFile(item.filename)">
        <div class="download-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <line x1="9" y1="15" x2="12" y2="18"/>
            <line x1="15" y1="15" x2="12" y2="18"/>
          </svg>
        </div>
        <div class="download-info">
          <span class="download-title">{{ item.title }}</span>
          <span class="download-desc">{{ item.description }}</span>
        </div>
        <div class="download-arrow">↓</div>
      </div>
    </div>
  </div>
</div>
