<section class="ic-page">
  <img
    class="hero-image"
    src="assets/images/home-900.jpg"
    srcset="assets/images/home-900.jpg 900w, assets/images/home-1400.jpg 1400w"
    sizes="(max-width: 480px) 100vw, 28rem"
    alt=""
  />

  <div class="content">
    <app-back-link to="/" label="Torna al sito" />

    <h1>🐾 Richiedi un Incontro Conoscitivo</h1>
    <p class="intro">
      Raccontaci di te e del tuo cane: al passo successivo scegli subito il giorno che preferisci
      per conoscerci di persona.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field-row">
        <label>
          Nome
          <input type="text" formControlName="name" autocomplete="given-name" />
        </label>
        <label>
          Cognome
          <input type="text" formControlName="surname" autocomplete="family-name" />
        </label>
      </div>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <div class="field-row">
        <label>
          Telefono
          <input type="tel" formControlName="phone" autocomplete="tel" />
        </label>
        <label>
          Nome del cane
          <input type="text" formControlName="dogName" />
        </label>
      </div>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Attendere…' : "Prenota l'incontro conoscitivo" }}
      </button>
    </form>

    <p class="privacy-note">
      Inviando la richiesta accetti la nostra
      <a routerLink="/prenotazioni/privacy">informativa privacy</a>.
    </p>
  </div>
</section>
