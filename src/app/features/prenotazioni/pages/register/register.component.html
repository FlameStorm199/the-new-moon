<section class="auth-page">
  <h1>🐾 Crea il tuo account</h1>

  @if (registered()) {
    <p>Registrazione completata. Controlla la tua email per confermare l'account prima di accedere.</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        Nome
        <input type="text" formControlName="name" autocomplete="given-name" />
      </label>

      <label>
        Cognome
        <input type="text" formControlName="surname" autocomplete="family-name" />
      </label>

      <label>
        Email
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Telefono
        <input type="tel" formControlName="phone" autocomplete="tel" />
      </label>

      <label>
        Nome del cane
        <input type="text" formControlName="dogName" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Registrazione in corso…' : 'Registrati' }}
      </button>
    </form>

    <p>Hai già un account? <a routerLink="/prenotazioni/login">Accedi</a></p>
  }
</section>
