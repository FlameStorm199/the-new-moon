<div class="backdrop" (click)="onBackdropClick()">
  <!-- stopPropagation: un clic dentro il pannello non deve chiuderlo -->
  <div
    class="panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="incontro-booking-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="close-x"
      [disabled]="busy"
      (click)="closed.emit()"
      aria-label="Chiudi"
    >
      ✕
    </button>

    <h2 id="incontro-booking-dialog-title">Confermi l'Incontro Conoscitivo?</h2>

    <div class="detail">
      <span class="date">{{ dateLabel }}</span>
      <span class="time">{{ timeLabel }}</span>
    </div>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <div class="actions">
      <button
        #primaryAction
        type="button"
        class="primary"
        [disabled]="busy"
        (click)="confirm()"
      >
        {{ busy ? 'Invio…' : 'Prenota' }}
      </button>
    </div>
  </div>
</div>
