<div class="backdrop" (click)="onBackdropClick()">
  <!-- stopPropagation: un clic dentro il pannello non deve chiuderlo -->
  <div
    class="panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="booking-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="close-x"
      [disabled]="busy"
      (click)="closed.emit()"
      aria-label="Chiudi"
    >
      ✕
    </button>

    @if (state === 'confirm') {
      <h2 id="booking-dialog-title">Confermi la prenotazione?</h2>

      <div class="detail">
        <span class="date">{{ dateLabel }}</span>
        <span class="time">{{ timeLabel }}</span>
      </div>

      <p class="note">Puoi prenotare una lezione a settimana.</p>

      <label class="field">
        Note per l'educatore (facoltative)
        <textarea #noteInput rows="2" [disabled]="busy"></textarea>
      </label>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <div class="actions">
        <button
          #primaryAction
          type="button"
          class="primary"
          [disabled]="busy"
          (click)="confirm()"
        >
          {{ busy ? 'Prenotazione…' : 'Prenota' }}
        </button>
      </div>
    } @else {
      <div class="tick" aria-hidden="true">✓</div>

      <h2 id="booking-dialog-title">Lezione prenotata</h2>

      <div class="detail">
        <span class="date">{{ dateLabel }}</span>
        <span class="time">{{ timeLabel }}</span>
      </div>

      <p class="note">Ti abbiamo inviato un'email di conferma.</p>

      <div class="actions">
        <a #primaryAction routerLink="/prenotazioni/le-mie-lezioni" class="link-action">
          Le mie lezioni
        </a>
      </div>
    }
  </div>
</div>
