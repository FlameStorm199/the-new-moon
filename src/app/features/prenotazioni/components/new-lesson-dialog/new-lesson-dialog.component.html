<div class="backdrop" (click)="onBackdropClick()">
  <!-- stopPropagation: un clic dentro il pannello non deve chiuderlo -->
  <div
    class="panel wide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="new-lesson-dialog-title"
    (click)="$event.stopPropagation()"
  >
    @if (state === 'form') {
      <h2 id="new-lesson-dialog-title">Prenota per un cliente</h2>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          Cliente
          <select #firstField formControlName="customerId">
            <option value="">— scegli —</option>
            @for (customer of customers; track customer.id) {
              <option [value]="customer.id">
                {{ customer.surname }} {{ customer.name }}
                @if (customer.dog_name) {
                  ({{ customer.dog_name }})
                }
              </option>
            }
          </select>
        </label>

        <label class="field">
          Slot libero
          <select formControlName="slotId">
            <option value="">— scegli —</option>
            @for (slot of freeSlots; track slot.id) {
              <option [value]="slot.id">{{ slotLabel(slot) }}</option>
            }
          </select>
        </label>

        <label class="field">
          Note (facoltative)
          <input type="text" formControlName="description" />
        </label>

        <label class="field checkbox">
          <input type="checkbox" formControlName="bypassWeeklyLimit" />
          Scavalca il limite di una lezione a settimana
        </label>

        @if (errorMessage) {
          <p class="error">{{ errorMessage }}</p>
        }

        <div class="actions">
          <button type="button" class="secondary" [disabled]="busy" (click)="closed.emit()">
            Annulla
          </button>
          <button #primaryAction type="submit" class="primary" [disabled]="busy">
            {{ busy ? 'Prenotazione…' : 'Prenota' }}
          </button>
        </div>
      </form>
    } @else if (summary) {
      <div class="tick" aria-hidden="true">✓</div>

      <h2 id="new-lesson-dialog-title">Lezione prenotata</h2>

      <div class="detail">
        <span class="who">{{ summary.customerLabel }}</span>
        <span class="date">{{ summary.slotLabel }}</span>
      </div>

      <p class="note">Il cliente riceve un'email di conferma.</p>

      <div class="actions">
        <button #primaryAction type="button" class="primary" (click)="closed.emit()">
          Chiudi
        </button>
      </div>
    }
  </div>
</div>
