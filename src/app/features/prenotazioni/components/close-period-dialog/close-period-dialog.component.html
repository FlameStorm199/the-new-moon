<div class="backdrop" (click)="onBackdropClick()">
  <!-- stopPropagation: un clic dentro il pannello non deve chiuderlo -->
  <div
    class="panel wide"
    role="dialog"
    aria-modal="true"
    aria-labelledby="close-period-dialog-title"
    (click)="$event.stopPropagation()"
  >
    @if (state === 'form') {
      <h2 id="close-period-dialog-title">Chiudi o riapri un periodo</h2>

      <form [formGroup]="form" novalidate>
        <div class="field-row">
          <label class="field">
            Dal
            <input #firstField type="date" formControlName="dateFrom" />
          </label>

          <label class="field">
            Al (facoltativo)
            <input type="date" formControlName="dateTo" />
          </label>
        </div>

        <label class="field">
          Cosa
          <select formControlName="scope">
            <option value="giornata">Tutta la giornata</option>
            <option value="mattina">Solo mattina</option>
            <option value="pomeriggio">Solo pomeriggio</option>
          </select>
        </label>

        @if (displayError) {
          <p class="error">{{ displayError }}</p>
        }

        <div class="actions">
          <button type="button" class="secondary" [disabled]="busy" (click)="closed.emit()">
            Annulla
          </button>
          <button type="button" class="warning" [disabled]="busy" (click)="submit(false)">
            {{ busy ? 'Attendi…' : 'Tieni libero' }}
          </button>
          <button
            #primaryAction
            type="button"
            class="primary"
            [disabled]="busy"
            (click)="submit(true)"
          >
            Riapri
          </button>
        </div>
      </form>
    } @else {
      <div class="tick" aria-hidden="true">✓</div>

      <h2 id="close-period-dialog-title">Fatto</h2>

      @if (resultMessage) {
        <p class="note">{{ resultMessage }}</p>
      }

      <div class="actions">
        <button #primaryAction type="button" class="primary" (click)="closed.emit()">
          Chiudi
        </button>
      </div>
    }
  </div>
</div>
